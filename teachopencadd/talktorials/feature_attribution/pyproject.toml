[project]
name = "talktorial-xai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcos>=0.1.3",
    "chemprop>=2.3.1",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.1",
    "notebook>=7.6.2",
    "polars>=1.43.2",
    "polars-random>=0.5.0",
    "rdkit>=2026.3.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.0",
    "jupyterlab>=4.4.0",
    "matplotlib>=3.10.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talktorial_xai"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
